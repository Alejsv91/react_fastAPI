services:
  db:
    image: postgres:17
    container_name: condohub_db

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: condohub_api

    build:
      context: ./backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - db

    volumes:
      - ./backend:/app

volumes:
  postgres_data: